name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHELLCHECK_REQUIRED: '1'
    defaults:
      run:
        working-directory: phpurs/phpurs
    steps:
      - name: Checkout phpurs
        uses: actions/checkout@v4
        with:
          path: phpurs/phpurs

      # Mirror the documented local layout: ../../purescript-backend-optimizer-phpurs
      # relative to the phpurs checkout, at the revision pinned in tools/toolchain.json.
      - name: Checkout pinned PBO fork
        uses: actions/checkout@v4
        with:
          repository: 0x000000000000000000001/purescript-backend-optimizer
          ref: ef2fdae421ff998352a77407d861540d6b287928
          path: purescript-backend-optimizer-phpurs

      - name: Checkout phpurs-prelude
        uses: actions/checkout@v4
        with:
          repository: 0x000000000000000000001/phpurs-prelude
          ref: 57f5292e8f108bba68c8e608576d55b59bbc1e0f
          path: phpurs/phpurs-prelude

      - name: Checkout phpurs-foldable-traversable
        uses: actions/checkout@v4
        with:
          repository: 0x000000000000000000001/phpurs-foldable-traversable
          ref: a9a7dc535a9f4a07d7293e8741520dbbd9dc46b6
          path: phpurs/phpurs-foldable-traversable

      - name: Checkout phpurs-arrays
        uses: actions/checkout@v4
        with:
          repository: 0x000000000000000000001/phpurs-arrays
          ref: 6f7f72e54c42163b596eecdb6f43e38154e929a9
          path: phpurs/phpurs-arrays

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: phpurs/phpurs/package-lock.json

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Check pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node tools/check-commit-msg.mjs "$PR_TITLE"

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Cache Spago global state
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/spago-nodejs
            ~/.cache/spago
          key: spago-${{ runner.os }}-${{ hashFiles('phpurs/phpurs/spago.lock') }}

      - name: Install dependencies
        run: npm ci

      - name: Check toolchain
        run: npm run check:toolchain

      - name: Check formatting
        run: npm run format:check

      - name: Check conventions
        run: npm run check:conventions

      - name: Check source map
        run: npm run check:source-map

      - name: Check docs
        run: npm run check:docs

      - name: Check shell
        run: npm run check:shell

      - name: Build
        run: npm run build

      - name: Golden
        run: npm run test:golden

      - name: Codegen tests
        run: |
          set -o pipefail
          npm run test:codegen 2>&1 | tee codegen-tests.log

      - name: Report failing codegen tests
        if: failure()
        run: |
          node --test --test-reporter=spec tests/codegen/direct/array-callbacks.mjs tests/codegen/direct/callback-specialization.mjs > rerun.log 2>&1 || true
          grep -E -A8 "AssertionError|Error:" rerun.log | head -80 | while IFS= read -r line; do
            echo "::error title=codegen-assert::$line"
          done

      - name: Coverage report (non-blocking)
        continue-on-error: true
        run: npm run test:coverage

      - name: TAST smoke (non-blocking, skipped without the fork)
        continue-on-error: true
        run: npm run test:tast-smoke
